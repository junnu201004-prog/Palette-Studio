<head>
<meta charset="utf-8">

<title>54 UI Colour Combinations</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#263049}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#263049}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 18px}
h2{font-size:1.05rem;margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card h3{font-size:.9rem;margin:0;padding:10px 12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:.8rem;cursor:pointer;border:0;width:100%;font-family:inherit;text-align:left}
.sw b{font-weight:600}
.sw span{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;opacity:.85}
.sw i{font-style:normal;font-size:.6rem;opacity:.7;margin-left:4px}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:.8rem;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
